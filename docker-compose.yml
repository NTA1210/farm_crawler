services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  farm-crawler:
    build: .
    env_file: .env
    environment:
      # Container-to-container traffic must use the Compose service hostname.
      MONGODB_URI: mongodb://mongodb:27017/farm_crawler
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
